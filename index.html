<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centres EAP — DQPRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: "Inter", system-ui, sans-serif; color: #2c3345; }
#carte { position: fixed; inset: 0; background: #f4f3ef; }

#panneau { position: fixed; top: 14px; left: 14px; z-index: 1100; width: 242px; background: rgba(255,255,255,.96); backdrop-filter: blur(6px); border: 1px solid #e3e0d8; border-radius: 14px; box-shadow: 0 10px 28px rgba(27,42,74,.14); padding: 15px 17px 14px; }
.sur-titre { margin: 0; font: 600 10.5px "Inter"; letter-spacing: 1.4px; text-transform: uppercase; color: #a96a32; }
#panneau h1 { margin: 3px 0 0; font: 700 21px "Sora", sans-serif; color: #1b2a4a; }
.seg { display: flex; background: #f1efe9; border-radius: 999px; padding: 3px; margin: 11px 0 0; }
.seg button { flex: 1; border: 0; background: none; padding: 6px 0; border-radius: 999px; font: 600 12px "Inter"; color: #5a6272; cursor: pointer; }
.seg button.actif { background: #1b2a4a; color: #fff; }
#sel-mach { width: 100%; margin: 9px 0 0; padding: 7px 9px; border: 1px solid #e3e0d8; border-radius: 10px; background: #fff; font: 600 12px "Inter"; color: #5a6272; cursor: pointer; }
#filt-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
#filt-chips:empty { margin: 0; }
#btn-centres, #btn-machines { width: 100%; margin: 9px 0 0; padding: 8px 9px; border: 1px solid #e3e0d8; border-radius: 10px; background: #fff; font: 600 12px "Inter"; color: #5a6272; cursor: pointer; text-align: left; }
#btn-centres:hover, #btn-machines:hover { border-color: #b9b4a6; color: #1b2a4a; }
.legende { list-style: none; margin: 11px 0 0; padding: 0; display: grid; gap: 5px; font-size: 12px; }
.legende li { display: flex; align-items: center; gap: 7px; }
.puce { width: 12px; height: 12px; border-radius: 50%; flex: none; border: 1px solid rgba(0,0,0,.08); }
.puce.im { background: #1f6fd6; }
.puce.rth { background: #e07c00; }
.puce.mixte { background: linear-gradient(135deg, #1f6fd6 0 50%, #e07c00 50% 100%); }
#stats { margin: 11px 0 0; font: 600 12px "Inter"; color: #1b2a4a; }

.pin { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.28); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.pin span { color: #fff; font: 700 12px "Inter"; }
.pin.im { background: #1f6fd6; }
.pin.rth { background: #e07c00; }
.pin.mixte { background: linear-gradient(135deg, #1f6fd6 0 50%, #e07c00 50% 100%); }
.pin.pos { background: #1b2a4a; }
.grappe { width: 34px; height: 34px; border-radius: 50%; background: #1b2a4a; color: #fff; display: flex; align-items: center; justify-content: center; font: 700 13px "Inter"; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.3); cursor: pointer; }

#fiche { position: fixed; top: 14px; right: 14px; bottom: 14px; z-index: 1200; width: 440px; max-width: calc(100vw - 28px); background: #fff; border: 1px solid #e3e0d8; border-radius: 14px; box-shadow: 0 14px 36px rgba(27,42,74,.2); display: flex; flex-direction: column; }
#fiche[hidden] { display: none; }
.fiche-barre { display: flex; align-items: center; gap: 8px; margin: 8px 8px 0; flex: none; }
#fiche-retour { border: 0; border-radius: 999px; background: #f1efe9; color: #1b2a4a; font: 600 12px "Inter"; padding: 7px 13px; cursor: pointer; }
#fiche-retour:hover { background: #e4e1d8; }
#fiche-retour[hidden] { display: none; }
#fiche-fermer { margin-left: auto; width: 30px; height: 30px; border: 0; border-radius: 50%; background: #f1efe9; color: #1b2a4a; font: 700 15px "Inter"; cursor: pointer; flex: none; }
#fiche-fermer:hover { background: #e4e1d8; }
#fiche-contenu { overflow-y: auto; padding: 0 22px 22px; }
#fiche h2 { margin: 2px 0 4px; font: 700 20px "Sora", sans-serif; color: #1b2a4a; }
.etab { margin: 0 0 8px; font-size: 13px; color: #5a6272; }
.ligne-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 12px; }
.lien-site { font: 600 12.5px "Inter"; color: #1f6fd6; text-decoration: none; }
.lien-site:hover { text-decoration: underline; }
.btn-modif { border: 1px solid #e3e0d8; background: none; border-radius: 999px; padding: 4px 11px; font: 600 11px "Inter"; color: #5a6272; cursor: pointer; }
.btn-modif:hover { border-color: #b9b4a6; color: #1b2a4a; }
.photos { display: flex; gap: 8px; overflow-x: auto; margin: 0 0 12px; }
.photos img { height: 86px; border-radius: 8px; display: block; }
.tab { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 0 0 12px; }
.tab th, .tab td { border: 1px solid #eceae3; padding: 5px 8px; text-align: center; }
.tab thead th { background: #f7f6f1; font-weight: 600; color: #5a6272; }
.tab tbody th { background: #f7f6f1; font-weight: 600; color: #5a6272; text-align: left; }
.tab .cur { background: #eef4fd; color: #1b2a4a; font-weight: 700; }
.tab thead th.cur { background: #dcebfb; }
.refs p { margin: 2px 0; font-size: 13px; }
.sec h3 { margin: 18px 0 6px; font: 700 11px "Inter"; letter-spacing: .9px; text-transform: uppercase; color: #8a8f9c; padding-bottom: 4px; border-bottom: 1px solid #eceae3; }
.sous-mod { margin: 10px 0 3px; font: 700 12px "Inter"; color: #1b2a4a; }
.texte.just { text-align: justify; }
.texte u { text-decoration: underline; }
.ssec-outils { display: flex; gap: 4px; }
.btn-fmt, .btn-just { flex: none; width: 28px; height: 26px; border: 1px solid #eceae3; border-radius: 7px; background: #fff; color: #5a6272; font: 600 12px "Inter"; cursor: pointer; padding: 0; }
.btn-fmt:hover, .btn-just:hover { background: #f7f6f1; color: #1b2a4a; }
.btn-just { margin-left: auto; }
.btn-just.actif { background: #eef4fd; border-color: #cfe0f7; color: #1f6fd6; }
.sec h4.sous-mod:first-child { margin-top: 0; }
.texte { margin: 0; white-space: pre-line; font-size: 13px; line-height: 1.55; }
.texte a { color: #1f6fd6; }
.conds { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 13px; }
.conds dt { color: #5a6272; font-weight: 600; }
.conds dd { margin: 0; }
.conds dd.texte { white-space: pre-line; }
.sec .texte + .conds, .sec .conds + .texte, .mach-chips + .texte { margin-top: 8px; }
.mach-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.mach-chip { border: 1px solid #cfe0f7; background: #eef4fd; border-radius: 999px; padding: 5px 11px; font: 600 12px "Inter"; color: #1f6fd6; cursor: pointer; }
.mach-chip:hover { background: #dcebfb; }
.mach-liste-centres { display: grid; gap: 6px; }
.aills { display: flex; flex-wrap: wrap; gap: 6px; }
.aill, .aill-lien { display: inline-flex; align-items: center; padding: 5px 11px; border-radius: 999px; background: #fdf3e7; border: 1px solid #f0dcc2; color: #a96a32; font: 600 12px "Inter"; cursor: pointer; text-decoration: none; }
.aill:hover, .aill-lien:hover { background: #fae7ce; }
.aill-txt { display: inline-flex; padding: 5px 11px; border-radius: 999px; background: #f7f6f1; border: 1px solid #e3e0d8; color: #5a6272; font: 600 12px "Inter"; }
.res { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; width: 100%; text-align: left; padding: 9px 11px; border: 1px solid #eceae3; border-radius: 10px; background: #fff; margin: 0; font: 600 13px "Inter"; color: #1b2a4a; cursor: pointer; }
.res span { color: #8a8f9c; font: 400 12px "Inter"; }
.res:hover { background: #f7f6f1; }
.gc-nouveau { display: block; width: 100%; margin: 10px 0 12px; border: 1px dashed #cfc9ba; border-radius: 10px; background: none; padding: 9px 0; font: 600 12px "Inter"; color: #5a6272; cursor: pointer; }
.gc-nouveau:hover { border-color: #a96a32; color: #a96a32; }
.gc-item { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; }
.gc-item input { width: 16px; height: 16px; flex: none; accent-color: #1b2a4a; cursor: pointer; }
.gc-item .res { flex: 1; }
.form label { display: block; margin: 14px 0 3px; font: 700 11px "Inter"; letter-spacing: .7px; text-transform: uppercase; color: #8a8f9c; }
.form input, .form textarea, .form select { width: 100%; border: 1px solid #ddd9cf; border-radius: 8px; padding: 7px 9px; font: 13px "Inter"; color: #2c3345; background: #fff; }
.form textarea { min-height: 72px; resize: vertical; line-height: 1.5; }
.form textarea.grand { min-height: 150px; }
.form .duo, .form .eq { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.form .astuce { margin: 3px 0 0; font-size: 11.5px; color: #8a8f9c; }
.pos-ligne { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; }
.btn-pos { border: 1px solid #cfe0f7; border-radius: 8px; background: #eef4fd; color: #1f6fd6; font: 600 12px "Inter"; padding: 0 12px; cursor: pointer; }
.btn-pos:hover { background: #dcebfb; }
.form label.case { display: flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font: 600 13px "Inter"; color: #2c3345; cursor: pointer; }
.form label.case input { width: 16px; height: 16px; accent-color: #1b2a4a; }
.pl-grille { display: grid; grid-template-columns: auto 1fr 1fr 1fr; gap: 6px 8px; align-items: center; }
.pl-tete { text-align: center; font: 700 11px "Inter"; color: #8a8f9c; }
.pl-lig { font: 600 12px "Inter"; color: #5a6272; }
.pl-grille input { text-align: center; }
.btn-mini { flex: none; width: 30px; height: 30px; border: 1px solid #eceae3; border-radius: 8px; background: #fff; color: #5a6272; font: 700 13px "Inter"; cursor: pointer; padding: 0; }
.btn-mini.large { width: auto; padding: 0 8px; font: 600 11px "Inter"; }
.btn-mini:hover { background: #f7f6f1; color: #1b2a4a; }
.btn-mini.rouge:hover { color: #b3382f; border-color: #e6c4c1; }
.btn-mini.ssec-pos { background: #eef4fd; border-color: #cfe0f7; color: #1f6fd6; font: 700 11px "Inter"; letter-spacing: -.5px; }
.btn-mini.ssec-pos:hover { background: #dcebfb; color: #1f6fd6; border-color: #a9cdf3; }
.gcm-ligne { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; }
.gcm-cat-nom { flex: 1; font: 700 13px "Inter"; color: #1b2a4a; }
.gcm-mach-nom { flex: 1; font: 400 13px "Inter"; color: #2c3345; }
.gcm-nb { font: 600 11px "Inter"; color: #8a8f9c; }
.btn-mini.gcm-pli { width: 24px; height: 24px; font-size: 10px; }
.gcm-dest { max-width: 150px; font: 600 11px "Inter"; color: #5a6272; border: 1px solid #eceae3; border-radius: 8px; padding: 6px 6px; background: #fff; cursor: pointer; }
.th-bloc { border: 1px solid #e3e0d8; border-radius: 12px; padding: 12px; margin: 0 0 12px; background: #fbfaf7; }
.th-barre { display: flex; gap: 6px; align-items: center; margin: 0 0 4px; }
.th-barre input.th-titre { flex: 1; font: 700 11px "Inter"; letter-spacing: .7px; text-transform: uppercase; color: #5a6272; background: #fff; }
.vis { display: flex; flex: none; align-items: center; cursor: pointer; }
.vis input { width: 16px; height: 16px; accent-color: #1b2a4a; cursor: pointer; }
.th-retablir { margin: 0 0 4px; font: 600 11.5px "Inter"; color: #8a8f9c; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.th-retablir:empty { display: none; }
.th-re { border: 1px dashed #cfc9ba; border-radius: 999px; background: none; padding: 4px 11px; font: 600 11px "Inter"; color: #5a6272; cursor: pointer; }
.th-re:hover { border-color: #a96a32; color: #a96a32; }
.ssec-item { border: 1px solid #eceae3; border-radius: 10px; padding: 10px; margin: 8px 0 0; display: grid; gap: 6px; background: #fff; }
.ssec-haut { display: flex; gap: 6px; }
.ssec-haut input.ssec-titre { flex: 1; }
.ssec-add { display: block; width: 100%; margin: 8px 0 0; border: 1px dashed #cfc9ba; border-radius: 10px; background: none; padding: 8px 0; font: 600 12px "Inter"; color: #5a6272; cursor: pointer; }
.ssec-add:hover, #th-add:hover { border-color: #a96a32; color: #a96a32; }
#th-add { display: block; width: 100%; margin: 0 0 4px; border: 1px dashed #cfc9ba; border-radius: 12px; background: none; padding: 10px 0; font: 600 12px "Inter"; color: #5a6272; cursor: pointer; }
.mach-edit .mach-chips { margin: 0 0 8px; }
.mach-edit .mach-chips:empty { display: none; }
.ssec-item[data-type="machines"] .mach-edit { display: grid; gap: 6px; }
.mchip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 7px 4px 11px; border-radius: 999px; background: #eef4fd; border: 1px solid #cfe0f7; color: #1f6fd6; font: 600 12px "Inter"; }
.mchip button { border: 0; background: none; color: #1f6fd6; cursor: pointer; font: 700 13px "Inter"; padding: 0 2px; line-height: 1; }
.mchip button:hover { color: #b3382f; }
.form-btns { display: flex; gap: 8px; margin-top: 18px; }
.btn-val { flex: 1; border: 0; border-radius: 10px; padding: 10px 0; background: #1b2a4a; color: #fff; font: 700 13px "Inter"; cursor: pointer; }
.btn-ann { flex: 1; border: 0; border-radius: 10px; padding: 10px 0; background: #f1efe9; color: #5a6272; font: 700 13px "Inter"; cursor: pointer; }
.btn-val:hover { background: #24406e; }
.btn-ann:hover { background: #e4e1d8; }

#placement { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 1400; display: flex; align-items: center; gap: 9px; max-width: calc(100vw - 28px); background: #1b2a4a; color: #fff; border-radius: 999px; padding: 8px 9px 8px 16px; font: 600 12px "Inter"; box-shadow: 0 10px 28px rgba(27,42,74,.3); }
#placement[hidden] { display: none; }
#placement button { border: 0; border-radius: 999px; padding: 6px 12px; font: 700 12px "Inter"; cursor: pointer; }
#placement-val { background: #fff; color: #1b2a4a; }
#placement-val:disabled { opacity: .35; cursor: default; }
#placement-ann { background: rgba(255,255,255,.14); color: #fff; }

#mini { position: fixed; left: 14px; bottom: 14px; z-index: 1100; width: 182px; background: #fff; border: 1px solid #e3e0d8; border-radius: 12px; box-shadow: 0 8px 24px rgba(27,42,74,.14); overflow: hidden; }
#mini:hover { box-shadow: 0 10px 28px rgba(27,42,74,.22); }
#mini-btn { position: absolute; inset: 0; z-index: 6; background: none; border: 0; cursor: pointer; }
#mini-btn:focus-visible { outline: 3px solid #1f6fd6; outline-offset: -3px; border-radius: 12px; }
.mini-titre { display: flex; justify-content: space-between; align-items: baseline; margin: 0; padding: 8px 11px 6px; font: 600 12px "Sora", sans-serif; color: #1b2a4a; }
#mini-badge { font: 600 11px "Inter"; color: #e07c00; }
#mini-carte { height: 106px; pointer-events: none; background: #f4f3ef; }

#etat { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 1300; max-width: calc(100vw - 28px); background: #a96a32; color: #fff; border-radius: 999px; padding: 9px 18px; font: 600 12px "Inter"; box-shadow: 0 10px 28px rgba(27,42,74,.3); text-align: center; }
#etat[hidden] { display: none; }
.gc-sauv { margin: 18px 0 0; font-size: 11.5px; color: #b9b4a6; }
.lien-sauv { border: 0; background: none; padding: 0; font: 600 11.5px "Inter"; color: #8a8f9c; cursor: pointer; text-decoration: underline; }
.lien-sauv:hover { color: #1b2a4a; }

.leaflet-control-attribution { font-size: 10px; }

.coin-fermer { position: absolute; top: 7px; right: 7px; width: 22px; height: 22px; border: 0; border-radius: 50%; background: #f1efe9; color: #5a6272; font: 700 12px "Inter"; line-height: 1; cursor: pointer; z-index: 8; padding: 0; }
.coin-fermer:hover { background: #e4e1d8; color: #1b2a4a; }
.flottant { position: fixed; z-index: 1100; width: 40px; height: 40px; border: 1px solid #e3e0d8; border-radius: 50%; background: rgba(255,255,255,.96); color: #1b2a4a; font: 700 13px "Inter"; cursor: pointer; box-shadow: 0 8px 24px rgba(27,42,74,.18); padding: 0; }
.flottant:hover { background: #fff; }
.flottant[hidden] { display: none; }
#panneau-ouvrir { top: 14px; left: 14px; font-size: 16px; }
#mini-ouvrir { bottom: 14px; left: 14px; font-size: 11px; }

@media (max-width: 640px) {
  #panneau { width: 208px; padding: 12px 14px 12px; }
  #panneau h1 { font-size: 18px; }
  #fiche { top: 0; right: 0; bottom: 0; left: 0; width: auto; max-width: none; border-radius: 0; }
  #mini { width: 148px; }
  #mini-carte { height: 88px; }
}
</style>
</head>
<body>
<div id="carte"></div>

<header id="panneau">
  <button type="button" class="coin-fermer" id="panneau-fermer" aria-label="Masquer le panneau">&times;</button>
  <p class="sur-titre">DQPRM</p>
  <h1>Centres EAP</h1>
  <div class="seg" id="seg-sem">
    <button type="button" data-val="S1" class="actif">S1</button>
    <button type="button" data-val="S2">S2</button>
    <button type="button" data-val="S3">S3</button>
  </div>
  <div class="seg" id="seg-mod">
    <button type="button" data-val="tous" class="actif">Toutes</button>
    <button type="button" data-val="im">RX·MN</button>
    <button type="button" data-val="rth">RTH</button>
  </div>
  <select id="sel-mach" aria-label="Filtrer les centres par machine">
    <option value="">Filtrer par machine…</option>
  </select>
  <div id="filt-chips"></div>
  <button id="btn-machines" type="button">Gérer les machines (catégories…)</button>
  <button id="btn-centres" type="button">Gérer les centres (activer, créer…)</button>
  <ul class="legende">
    <li><span class="puce im"></span>Imagerie (RX / MN)</li>
    <li><span class="puce rth"></span>Radiothérapie</li>
    <li><span class="puce mixte"></span>Les deux</li>
  </ul>
  <p id="stats"></p>
</header>

<aside id="fiche" hidden aria-label="Fiche du centre">
  <div class="fiche-barre">
    <button id="fiche-retour" type="button" hidden>&larr; Retour</button>
    <button id="fiche-fermer" type="button" aria-label="Fermer la fiche">&times;</button>
  </div>
  <div id="fiche-contenu"></div>
</aside>

<div id="placement" hidden>
  <span id="placement-txt"></span>
  <button id="placement-val" type="button">Valider</button>
  <button id="placement-ann" type="button">Annuler</button>
</div>

<aside id="mini">
  <button id="mini-btn" type="button" aria-label="Aller à la Martinique"></button>
  <button type="button" class="coin-fermer" id="mini-fermer" aria-label="Masquer l'encart Martinique">&times;</button>
  <p class="mini-titre"><span id="mini-nom">Martinique</span><span id="mini-badge"></span></p>
  <div id="mini-carte"></div>
</aside>
<button id="panneau-ouvrir" class="flottant" type="button" hidden aria-label="Afficher le panneau">&#9776;</button>
<button id="mini-ouvrir" class="flottant" type="button" hidden aria-label="Afficher l'encart Martinique">MQ</button>

<div id="etat" hidden><span id="etat-txt"></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.20/leaflet-maplibre-gl.js"></script>
<script src="data.js"></script>
<script src="infos.js"></script>
<script src="config.js"></script>
<script>
function placesFor(c, sem) {
  var src = (c.places && c.places[sem]) || {};
  return { im: src.im || 0, rth: src.rth || 0 };
}
function displayedPlaces(c, sem, mod) {
  var p = placesFor(c, sem);
  return { im: mod === "rth" ? 0 : p.im, rth: mod === "im" ? 0 : p.rth };
}
function totalDisplayed(c, sem, mod) {
  var p = displayedPlaces(c, sem, mod);
  return p.im + p.rth;
}
function classify(c, sem, mod) {
  var p = displayedPlaces(c, sem, mod);
  if (p.im > 0 && p.rth > 0) return "mixte";
  if (p.im > 0) return "im";
  return "rth";
}

  var etatTxt = document.getElementById("etat-txt");
  function majEtat(mode) {
    if (mode === "enligne") { etatEl.hidden = true; return; }
    etatEl.hidden = false;
    if (mode === "local") etatTxt.textContent = "Base non configurée (config.js) — les modifications ne seront pas partagées.";
    else if (mode === "echec") etatTxt.textContent = "Enregistrement impossible (connexion ?) — dernière modification non partagée, revalidez plus tard.";
    else etatTxt.textContent = "Base injoignable — les modifications ne seront pas partagées.";
  }
  function apiTete(upsert) {
    var h = { "apikey": BASE.cle, "Authorization": "Bearer " + BASE.cle, "Content-Type": "application/json" };
    h.Prefer = upsert ? "resolution=merge-duplicates,return=minimal" : "return=minimal";
    return h;
  }
  function apiLire(chemin, cb) {
    fetch(BASE.url + "/rest/v1/" + chemin, { headers: apiTete(false) })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(cb)
      .catch(function () { cb(null); });
  }
  function apiEcrire(table, lignes, cb) {
    fetch(BASE.url + "/rest/v1/" + table, { method: "POST", headers: apiTete(true), body: JSON.stringify(lignes) })
      .then(function (r) { cb(r.ok); })
      .catch(function () { cb(false); });
  }
  function sauverCentre(c) {
    if (!BASE || !enLigne) { majEtat(BASE ? "echec" : "local"); return; }
    apiEcrire("centres", [{ id: c.id, data: copieData(c), infos: INFOS[c.id] || {} }], function (ok) {
      majEtat(ok ? "enligne" : "echec");
    });
  }
  function sauverMachines() {
    if (!BASE || !enLigne) return;
    apiEcrire("reglages", [{ cle: "machines", valeur: { machines: MACHINES, categories: CATS } }], function (ok) {
      majEtat(ok ? "enligne" : "echec");
    });
  }
  function chargerDepuisBase() {
    if (!BASE) { majEtat("local"); return; }
    apiLire("centres?select=*&order=id.asc", function (lignes) {
      if (lignes === null) { majEtat("horsligne"); return; }
      if (!lignes.length) {
        // Première ouverture : la base se remplit avec les données embarquées.
        var graine = CENTRES.map(function (c) { return { id: c.id, data: copieData(c), infos: INFOS[c.id] || {} }; });
        apiEcrire("centres", graine, function (ok1) {
          apiEcrire("reglages", [{ cle: "machines", valeur: { machines: MACHINES, categories: CATS } }], function (ok2) {
            enLigne = ok1 && ok2;
            majEtat(enLigne ? "enligne" : "horsligne");
          });
        });
        return;
      }
      CENTRES.length = 0;
      lignes.forEach(function (l) {
        var c = Object.assign({ id: l.id }, l.data || {});
        CENTRES.push(c);
        INFOS[l.id] = l.infos || {};
      });
      apiLire("reglages?select=*&cle=eq.machines", function (regs) {
        var val = regs && regs.length ? regs[0].valeur : null;
        var lm = Array.isArray(val) ? val : (val && Array.isArray(val.machines) ? val.machines : null);
        var lc = (val && Array.isArray(val.categories)) ? val.categories : null;
        if (lm && lm.length) {
          MACHINES.length = 0;
          lm.forEach(function (m) { if (m && m.nom) MACHINES.push({ nom: m.nom, alias: m.alias && m.alias.length ? m.alias : [m.nom], cat: m.cat || null }); });
          CATS.length = 0;
          (lc || []).forEach(function (c) { if (c && c.id && c.nom) CATS.push({ id: c.id, nom: c.nom, parent: c.parent || null }); });
        }
        enLigne = true;
        majEtat("enligne");
        remplirSelectMachines();
        render();
      });
    });
  }
  function centreParId(id) {
    for (var i = 0; i < CENTRES.length; i++) if (CENTRES[i].id === id) return CENTRES[i];
    return null;
  }

  var carte = L.map("carte", { center: VUE_METRO.centre, zoom: VUE_METRO.zoom, zoomControl: false, minZoom: 3, maxZoom: 19 });
  L.control.zoom({ position: "topright" }).addTo(carte);
  poserFond(carte, true);

  var grappe = L.markerClusterGroup({
    maxClusterRadius: 34,
    showCoverageOnHover: false,
    iconCreateFunction: function (cl) {
      return L.divIcon({ html: '<div class="grappe">' + cl.getChildCount() + "</div>", className: "", iconSize: [34, 34], iconAnchor: [17, 17] });
    }
  }).addTo(carte);

  var miniCarte = L.map("mini-carte", { center: VUE_MQ.centre, zoom: 8, zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false, touchZoom: false });
  poserFond(miniCarte, false);
  var miniCouche = L.layerGroup().addTo(miniCarte);

  function pastille(cls, n) {
    return L.divIcon({ html: '<div class="pin ' + cls + '"><span>' + n + "</span></div>", className: "", iconSize: [30, 30], iconAnchor: [15, 15] });
  }

  var ficheEl = document.getElementById("fiche");
  var ficheContenu = document.getElementById("fiche-contenu");
  var btnRetour = document.getElementById("fiche-retour");
  var ficheCentre = null;
  var ficheMode = "vue";
  var histo = [];
  var vueCourante = null;

  function infosDe(c) {
    return (c.id && INFOS[c.id]) || {};
  }

  function tableauPlaces(c) {
    var sems = ["S1", "S2", "S3"], i, p;
    var h = '<table class="tab"><thead><tr><th></th>';
    for (i = 0; i < sems.length; i++) h += '<th class="' + (sems[i] === state.sem ? "cur" : "") + '">' + sems[i] + "</th>";
    h += "</tr></thead><tbody><tr><th>RX / MN</th>";
    for (i = 0; i < sems.length; i++) { p = placesFor(c, sems[i]); h += '<td class="' + (sems[i] === state.sem ? "cur" : "") + '">' + (p.im || "·") + "</td>"; }
    h += "</tr><tr><th>RTH</th>";
    for (i = 0; i < sems.length; i++) { p = placesFor(c, sems[i]); h += '<td class="' + (sems[i] === state.sem ? "cur" : "") + '">' + (p.rth || "·") + "</td>"; }
    h += "</tr></tbody></table>";
    return h;
  }

  // Mise en forme légère : **gras**, *italique*, __souligné__ (vérifié sans effet
  // sur les textes repris mot pour mot du tableau des promos).
  function formaterTexte(t) {
    return esc(t)
      .replace(/\*\*([^\n]+?)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*\w])\*(\S[^*\n]*?)\*(?![*\w])/g, "$1<em>$2</em>")
      .replace(/__([^\n]+?)__/g, "<u>$1</u>");
  }
  function ddTexte(t, avecMails, just) {
    var x = formaterTexte(t);
    if (avecMails) x = lierMails(x);
    return '<dd class="texte' + (just ? " just" : "") + '">' + x + "</dd>";
  }
  function secTheme(titre, corps) {
    if (!corps) return "";
    return '<section class="sec"><h3>' + esc(titre) + "</h3>" + corps + "</section>";
  }
  function texteHtml(t, avecMails, just) {
    if (!t) return "";
    var x = formaterTexte(t);
    if (avecMails) x = lierMails(x);
    return '<p class="texte' + (just ? " just" : "") + '">' + x + "</p>";
  }
  function corpsTheme(c, inf, cle) {
    var els = elementsDuBloc(inf, cle, false, null);
    var avecMails = cle === "contacts";
    var out = "", tampon = "";
    function viderTampon() {
      if (tampon) { out += '<dl class="conds">' + tampon + "</dl>"; tampon = ""; }
    }
    els.forEach(function (s) {
      if (s.masque) return;
      if (s.type === "machines") {
        var machs = machinesDuCentre(MACHINES, inf);
        if (!machs.length) return;
        viderTampon();
        if (s.titre) out += '<h4 class="sous-mod">' + esc(s.titre) + "</h4>";
        out += '<div class="mach-chips">' + machs.map(function (m) {
          return '<button type="button" class="mach-chip" data-mach="' + esc(m.nom) + '" title="Voir les centres possédant cette machine">' + esc(m.nom) + "</button>";
        }).join("") + "</div>";
        return;
      }
      if (!s.texte) return;
      if (s.pos === "haut" || !s.titre) {
        viderTampon();
        if (s.titre) out += '<h4 class="sous-mod">' + esc(s.titre) + "</h4>";
        out += texteHtml(s.texte, avecMails, s.just);
      } else {
        tampon += "<dt>" + esc(s.titre) + "</dt>" + ddTexte(s.texte, avecMails, s.just);
      }
    });
    viderTampon();
    return out;
  }

  function ficheHtml(c) {
    var inf = infosDe(c);
    var h = '<p class="sur-titre">' + esc(c.ville) + "</p><h2>" + esc(c.nom) + "</h2>";
    h += '<p class="etab">' + esc(c.etablissement) + "</p>";
    h += '<p class="ligne-actions">';
    if (inf.site) h += '<a class="lien-site" href="' + esc(inf.site) + '" target="_blank" rel="noopener">Site du centre ↗</a>';
    h += '<button type="button" class="btn-modif">Modifier les infos</button></p>';
    if (inf.photos && inf.photos.length) {
      h += '<div class="photos">' + inf.photos.map(function (p) {
        return '<a href="' + esc(p) + '" target="_blank" rel="noopener"><img src="' + esc(p) + '" alt="' + esc(c.nom) + '" loading="lazy"></a>';
      }).join("") + "</div>";
    }
    h += tableauPlaces(c);
    var resp = inf.responsables || {};
    var refs = "";
    if (resp.im) refs += "<p><strong>Resp. imagerie :</strong> " + esc(resp.im) + "</p>";
    if (resp.rth) refs += "<p><strong>Resp. radiothérapie :</strong> " + esc(resp.rth) + "</p>";
    if (refs) h += '<div class="refs">' + refs + "</div>";
    if (inf.ailleurs && inf.ailleurs.length) {
      h += '<section class="sec"><h3>Formation en partie ailleurs</h3><div class="aills">' + inf.ailleurs.map(function (a) {
        if (a.id) return '<button type="button" class="aill" data-id="' + esc(a.id) + '">' + esc(a.texte) + " →</button>";
        if (a.url) return '<a class="aill-lien" href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(a.texte) + " ↗</a>";
        return '<span class="aill-txt">' + esc(a.texte) + "</span>";
      }).join("") + "</div></section>";
    }
    themesDe(inf).forEach(function (th) {
      if (th.masque) return;
      h += secTheme(th.titre, corpsTheme(c, inf, th.cle));
    });
    return h;
  }

  function gestionHtml() {
    var h = '<p class="sur-titre">Gestion</p><h2>Centres</h2>';
    h += '<p class="etab">Cochez pour afficher un centre sur la carte, décochez pour le masquer. Cliquez sur un nom pour ouvrir sa fiche.</p>';
    h += '<button type="button" id="gc-nouveau" class="gc-nouveau">+ Nouveau centre (placer un point sur la carte)</button>';
    var liste = CENTRES.slice().sort(function (a, b) { return (a.nom || "").localeCompare(b.nom || "", "fr"); });
    h += liste.map(function (c) {
      return '<div class="gc-item">' +
        '<input type="checkbox" class="gc-actif" data-id="' + esc(c.id) + '"' + (c.actif ? " checked" : "") + ' title="Afficher / masquer">' +
        '<button type="button" class="res gc-nom" data-id="' + esc(c.id) + '">' + esc(c.nom || c.id) + "<span>" + esc(c.ville || "") + "</span></button>" +
        "</div>";
    }).join("");
    h += '<p class="gc-sauv">Sauvegarde des données : <button type="button" class="lien-sauv" id="exp-data">data.js</button> · <button type="button" class="lien-sauv" id="exp-infos">infos.js</button></p>';
    return h;
  }

  function optionsDestCat(interdites, courant) {
    var h = '<option value=""' + (courant ? "" : " selected") + ">Sans catégorie</option>";
    function indent(p) { var s = "", i; for (i = 0; i < p; i++) s += "\u00a0\u00a0"; return s; }
    function niveau(parent, prof) {
      enfantsCat(parent).forEach(function (c) {
        if (interdites.indexOf(c.id) !== -1) return;
        h += '<option value="' + esc(c.id) + '"' + (courant === c.id ? " selected" : "") + ">" + indent(prof) + esc(c.nom) + "</option>";
        niveau(c.id, prof + 1);
      });
    }
    niveau(null, 0);
    return h;
  }
  var catsRepliees = (function () {
    try { return JSON.parse(localStorage.getItem("eap-cats-repliees") || "{}"); } catch (e) { return {}; }
  })();
  function sauverReplis() {
    try { localStorage.setItem("eap-cats-repliees", JSON.stringify(catsRepliees)); } catch (e) {}
  }
  function gestionMachinesHtml() {
    var h = '<p class="sur-titre">Gestion</p><h2>Machines</h2>';
    if (editionEnAttente) {
      h += '<p class="etab">Créez la machine souhaitée : elle sera ajoutée au centre et vous reviendrez à la fiche en cours de modification, sans rien perdre.</p>';
      h += '<button type="button" id="gcm-retour-edition" class="gc-nouveau">\u2190 Revenir à la fiche sans créer de machine</button>';
    }
    h += '<button type="button" id="gcm-cat" class="gc-nouveau">+ Nouvelle catégorie</button>';
    h += '<button type="button" class="gc-nouveau gcm-machplus" data-cat="">+ Nouvelle machine (sans catégorie)</button>';
    function ligneMach(m, prof) {
      return '<div class="gcm-ligne" style="margin-left:' + (prof * 16) + 'px">' +
        '<span class="gcm-mach-nom">' + esc(m.nom) + "</span>" +
        '<select class="gcm-dest" data-type="mach" data-nom="' + esc(m.nom) + '" title="Ranger dans\u2026">' + optionsDestCat([], m.cat || null) + "</select>" +
        '<button type="button" class="btn-mini rouge gcm-mach-del" data-nom="' + esc(m.nom) + '" title="Supprimer cette machine">&times;</button>' +
        "</div>";
    }
    function ligneCat(c, prof) {
      var interdites = [c.id].concat(descendantesCat(c.id));
      var enfants = enfantsCat(c.id), machs = machinesDeCat(c.id);
      var replie = !!catsRepliees[c.id];
      var n = enfants.length + machs.length;
      var s = '<div class="gcm-ligne" style="margin-left:' + (prof * 16) + 'px">' +
        '<button type="button" class="btn-mini gcm-pli" data-id="' + esc(c.id) + '" title="' + (replie ? "Déplier" : "Replier") + '">' + (replie ? "\u25b8" : "\u25be") + "</button>" +
        '<span class="gcm-cat-nom">' + esc(c.nom) + (replie && n ? ' <span class="gcm-nb">(' + n + ")</span>" : "") + "</span>" +
        '<button type="button" class="btn-mini large gcm-souscat" data-id="' + esc(c.id) + '" title="Créer une sous-catégorie">+ cat.</button>' +
        '<button type="button" class="btn-mini large gcm-machplus" data-cat="' + esc(c.id) + '" title="Créer une machine dans cette catégorie">+ mach.</button>' +
        '<select class="gcm-dest" data-type="cat" data-id="' + esc(c.id) + '" title="Ranger dans\u2026">' + optionsDestCat(interdites, c.parent || null) + "</select>" +
        '<button type="button" class="btn-mini rouge gcm-cat-del" data-id="' + esc(c.id) + '" title="Supprimer cette catégorie">&times;</button>' +
        "</div>";
      if (!replie) {
        enfants.forEach(function (sc) { s += ligneCat(sc, prof + 1); });
        machs.forEach(function (m) { s += ligneMach(m, prof + 1); });
      }
      return s;
    }
    var corps = "";
    enfantsCat(null).forEach(function (c) { corps += ligneCat(c, 0); });
    machinesDeCat(null).forEach(function (m) { corps += ligneMach(m, 0); });
    h += '<div class="gcm-arbre">' + corps + "</div>";
    return h;
  }

  function majRetour() {
    btnRetour.hidden = histo.length === 0;
  }
  function afficherVue(v) {
    if (!v) return;
    if (v.type === "gestion") {
      ficheCentre = null;
      ficheMode = "gestion";
      ficheContenu.innerHTML = gestionHtml();
    } else if (v.type === "gestion-machines") {
      ficheCentre = null;
      ficheMode = "gestion-machines";
      ficheContenu.innerHTML = gestionMachinesHtml();
    } else if (v.type === "machine") {
      ficheCentre = null;
      ficheMode = "machine";
      ficheContenu.innerHTML = machineHtml(v.nom);
    } else {
      var c = centreParId(v.id);
      if (!c) return;
      ficheCentre = c;
      ficheMode = "vue";
      ficheContenu.innerHTML = ficheHtml(c);
    }
    ficheEl.hidden = false;
    ficheContenu.scrollTop = 0;
    majRetour();
  }
  function naviguer(v, racine) {
    if (racine || ficheEl.hidden || ficheMode === "edition") histo = [];
    else if (vueCourante) histo.push(vueCourante);
    vueCourante = v;
    afficherVue(v);
  }
  function retour() {
    if (!histo.length) return;
    vueCourante = histo.pop();
    afficherVue(vueCourante);
  }
  btnRetour.addEventListener("click", retour);

  function fermerFiche() {
    ficheCentre = null;
    ficheMode = "vue";
    vueCourante = null;
    histo = [];
    editionEnAttente = null;
    ficheEl.hidden = true;
    majRetour();
  }
  document.getElementById("fiche-fermer").addEventListener("click", fermerFiche);
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (placement) { annulerPlacement(); return; }
    if (editionEnAttente) { reprendreEdition(); return; }
    fermerFiche();
  });

  // ——— Éditeur ———
  function champ(label, nom, valeur, astuce) {
    return "<label>" + label + '</label><input name="' + nom + '" value="' + esc(valeur || "") + '">' + (astuce ? '<p class="astuce">' + astuce + "</p>" : "");
  }
  function zone(label, nom, valeur, grand, astuce) {
    return "<label>" + label + '</label><textarea name="' + nom + '"' + (grand ? ' class="grand"' : "") + ">" + esc(valeur || "") + "</textarea>" + (astuce ? '<p class="astuce">' + astuce + "</p>" : "");
  }
  function glyphePos(pos) { return pos === "haut" ? "T\u2191" : "T\u2190"; }
  function titrePos(pos) {
    return pos === "haut"
      ? "Titre au-dessus du texte — cliquer pour le mettre à gauche"
      : "Titre à gauche du texte — cliquer pour le mettre au-dessus";
  }
  function ssecItem(s, inf) {
    s = s || { titre: "", texte: "", pos: "gauche", masque: false };
    var pos = s.pos === "haut" ? "haut" : "gauche";
    var mach = s.type === "machines";
    var h = '<div class="ssec-item" data-pos="' + pos + '"' +
      (s.just ? ' data-just="1"' : "") +
      (s.cle ? ' data-cle="' + esc(s.cle) + '"' : "") +
      (mach ? ' data-type="machines"' : "") + ">";
    h += '<div class="ssec-haut">';
    h += '<label class="vis" title="Afficher cette case sur la fiche"><input type="checkbox" class="ssec-vis"' + (s.masque ? "" : " checked") + "></label>";
    h += '<input class="ssec-titre" placeholder="Titre de la case" value="' + esc(s.titre || "") + '">';
    if (!mach) h += '<button type="button" class="btn-mini ssec-pos" title="' + titrePos(pos) + '">' + glyphePos(pos) + "</button>";
    h += '<button type="button" class="btn-mini ssec-up" title="Monter">&uarr;</button>';
    h += '<button type="button" class="btn-mini ssec-down" title="Descendre">&darr;</button>';
    h += '<button type="button" class="btn-mini rouge ssec-del" title="Supprimer la case">&times;</button>';
    h += "</div>";
    if (mach) {
      var liste = Array.isArray(inf && inf.machinesListe) ? inf.machinesListe.slice() : machinesDuCentre(MACHINES, inf || {}).map(function (m) { return m.nom; });
      h += '<div class="mach-edit">';
      h += '<div class="mach-chips mach-liste">' + liste.map(mchipHtml).join("") + "</div>";
      h += '<select class="mach-sel">' + optionsMachSel(liste) + "</select>";
      h += '<button type="button" class="ssec-add mach-va-creer">+ Créer une nouvelle machine\u2026</button>';
      h += "</div>";
    } else {
      h += '<div class="ssec-outils">';
      h += '<button type="button" class="btn-fmt" data-fmt="**" title="Gras"><b>G</b></button>';
      h += '<button type="button" class="btn-fmt" data-fmt="*" title="Italique"><i>I</i></button>';
      h += '<button type="button" class="btn-fmt" data-fmt="__" title="Souligné"><u>S</u></button>';
      h += '<button type="button" class="btn-just' + (s.just ? " actif" : "") + '" title="Justifier le texte">\u2261</button>';
      h += "</div>";
      h += '<textarea class="ssec-texte" placeholder="Contenu">' + esc(s.texte || "") + "</textarea>";
    }
    h += "</div>";
    return h;
  }
  function mchipHtml(nom) {
    return '<span class="mchip" data-nom="' + esc(nom) + '">' + esc(nom) + '<button type="button" class="mchip-del" title="Retirer">&times;</button></span>';
  }
  function optionsMachinesArbre(exclues) {
    var h = "";
    function indent(p) { var s = "", i; for (i = 0; i < p; i++) s += "\u00a0\u00a0\u00a0"; return s; }
    function niveau(parent, prof) {
      enfantsCat(parent).forEach(function (c) {
        h += "<option disabled>" + indent(prof) + "\u25b8 " + esc(c.nom) + "</option>";
        niveau(c.id, prof + 1);
      });
      machinesDeCat(parent).forEach(function (m) {
        if (exclues.indexOf(m.nom) !== -1) return;
        h += '<option value="' + esc(m.nom) + '">' + indent(prof) + esc(m.nom) + "</option>";
      });
    }
    niveau(null, 0);
    return h;
  }
  function optionsMachSel(deja) {
    return '<option value="">Ajouter une machine de la liste…</option>' + optionsMachinesArbre(deja);
  }
  function blocThemeHtml(c, inf, th) {
    var perso = !estThemeStandard(th.cle);
    var h = '<div class="th-bloc" data-cle="' + esc(th.cle) + '" data-perso="' + (perso ? "1" : "0") + '">';
    h += '<div class="th-barre">';
    h += '<label class="vis" title="Afficher ce bloc sur la fiche"><input type="checkbox" class="th-vis"' + (th.masque ? "" : " checked") + "></label>";

  function lireForm(c) {
    var inf0 = infosDe(c);
    function v(nom) {
      var el = ficheContenu.querySelector('[name="' + nom + '"]');
      return el ? el.value.trim() : "";
    }
    function vSi(nom, sinon) {
      var el = ficheContenu.querySelector('[name="' + nom + '"]');
      return el ? el.value.trim() : (sinon || "");
    }
    function n(nom) {
      var x = parseInt(v(nom), 10);
      return isNaN(x) || x < 0 ? 0 : x;
    }
    function f(nom, defaut) {
      var x = parseFloat(v(nom));
      return isNaN(x) ? defaut : x;
    }
    var actifEl = ficheContenu.querySelector('[name="c-actif"]');
    var themes = [];
    var sections = [];
    var machinesListe = [];
    var machinesItem = false;
    var heritesVus = {};
    var cles = THEMES.map(function (t) { return t[0]; });
    ficheContenu.querySelectorAll("#themes-edit > .th-bloc").forEach(function (bloc) {
      var perso = bloc.dataset.perso === "1";
      var titre = bloc.querySelector(".th-titre").value.trim();
      var cle;
      if (perso) {
        cle = slugTheme(titre, cles);
        cles.push(cle);
      } else {
        cle = bloc.dataset.cle;
        if (!titre) titre = titreStandard(cle);
      }
      themes.push({ cle: cle, titre: titre || cle, masque: !bloc.querySelector(".th-vis").checked });
      bloc.querySelectorAll(".ssec-item").forEach(function (el) {
        var s = {
          theme: cle,
          titre: el.querySelector(".ssec-titre").value.trim(),
          pos: el.dataset.pos === "haut" ? "haut" : "gauche",
          just: el.dataset.just === "1",
          masque: !el.querySelector(".ssec-vis").checked
        };
        if (el.dataset.cle) { s.cle = el.dataset.cle; heritesVus[el.dataset.cle] = true; }
        if (el.dataset.type === "machines") {
          s.type = "machines";
          s.texte = "";
          machinesItem = true;
          el.querySelectorAll(".mach-liste .mchip").forEach(function (chip) { machinesListe.push(chip.dataset.nom); });
          sections.push(s);
          return;
        }
        var ta = el.querySelector(".ssec-texte");
        s.texte = ta ? ta.value.trim() : "";
        var perso2 = false;
        if (s.cle) {
          var d = defautHerite(s.cle);
          perso2 = !d || s.titre !== (d.titre || "") || s.pos !== (d.pos || "gauche") || s.masque || s.just;
        }
        if (s.texte || (s.titre && !s.cle) || perso2) sections.push(s);
      });
    });
    // Un champ hérité repris dans une case n'est plus stocké à part (évite les doublons) ;
    // si son bloc a été retiré de la fiche, sa valeur reste enregistrée telle quelle.
    function herite(cle, val0) { return heritesVus[cle] ? "" : (val0 || ""); }
    var eq0 = inf0.equipe || {};
    return {
      data: {
        nom: v("c-nom") || c.nom || "Centre",
        etablissement: v("c-etab"),
        ville: v("c-ville"),
        lat: f("c-lat", c.lat),
        lng: f("c-lng", c.lng),
        actif: actifEl ? actifEl.checked : true,
        places: {
          S1: { im: n("pl-S1-im"), rth: n("pl-S1-rth") },
          S2: { im: n("pl-S2-im"), rth: n("pl-S2-rth") },
          S3: { im: n("pl-S3-im"), rth: n("pl-S3-rth") }
        }
      },
      infos: {
        responsables: { im: v("resp-im"), rth: v("resp-rth") },
        site: v("site"),
        photos: v("photos").split("\n").map(function (s) { return s.trim(); }).filter(Boolean),
        statut: herite("statut", inf0.statut),
        salaire: herite("salaire", inf0.salaire),
        retraite: herite("retraite", inf0.retraite),
        chomage: herite("chomage", inf0.chomage),
        conges: herite("conges", inf0.conges),
        revisions: herite("revisions", inf0.revisions),
        equipe: {
          physiciens: herite("equipe.physiciens", eq0.physiciens),
          dosimetristes: herite("equipe.dosimetristes", eq0.dosimetristes),
          techniciens: herite("equipe.techniciens", eq0.techniciens),
          ingenieurs: herite("equipe.ingenieurs", eq0.ingenieurs),
          autres: herite("equipe.autres", eq0.autres)
        },
        ailleurs: v("ailleurs").split("\n").map(function (s) { return s.trim(); }).filter(Boolean).map(function (l) {
          var morceaux = l.split("|");
          var e = { texte: morceaux[0].trim() };
          var cible = (morceaux[1] || "").trim();
          if (/^https?:\/\//i.test(cible)) e.url = cible;
          else if (cible) e.id = cible;
          return e;
        }),
        themes: themesEgaleStandard(themes) ? [] : themes,
        sections: sections,
        machinesListe: machinesItem ? machinesListe : (Array.isArray(inf0.machinesListe) ? inf0.machinesListe : null),
        machines: herite("machines", inf0.machines),
        avisIm: herite("avisIm", inf0.avisIm),
        avisRth: herite("avisRth", inf0.avisRth),
        avis: herite("avis", inf0.avis),
        avisAncIm: herite("avisAncIm", inf0.avisAncIm),
        avisAncRth: herite("avisAncRth", inf0.avisAncRth),
        avisAnciens: herite("avisAnciens", inf0.avisAnciens),
        contacts: herite("contacts", inf0.contacts)
      }
    };
  }

  // ——— Placement d'un point sur la carte ———
  var placement = null;
  var barrePl = document.getElementById("placement");
  var txtPl = document.getElementById("placement-txt");
  var valPl = document.getElementById("placement-val");
  var annPl = document.getElementById("placement-ann");

  function demarrerDeplacement() {
    var latEl = ficheContenu.querySelector('[name="c-lat"]');
    var lngEl = ficheContenu.querySelector('[name="c-lng"]');
    var lat = parseFloat(latEl && latEl.value);
    var lng = parseFloat(lngEl && lngEl.value);
    if (isNaN(lat) || isNaN(lng)) { lat = carte.getCenter().lat; lng = carte.getCenter().lng; }
    placement = { mode: "deplacer", marqueur: L.marker([lat, lng], { draggable: true, icon: pastille("pos", "✛") }).addTo(carte) };
    carte.panTo([lat, lng]);
    ficheEl.hidden = true;
    txtPl.textContent = "Déplacez le point à la bonne position, puis validez.";
    valPl.disabled = false;
    barrePl.hidden = false;
  }
  function demarrerNouveau() {
    placement = { mode: "nouveau", marqueur: null };
    ficheEl.hidden = true;
    txtPl.textContent = "Cliquez sur la carte pour placer le nouveau centre.";
    valPl.disabled = true;
    barrePl.hidden = false;
  }
  carte.on("click", function (e) {
    if (!placement || placement.mode !== "nouveau") return;
    if (!placement.marqueur) {
      placement.marqueur = L.marker(e.latlng, { draggable: true, icon: pastille("pos", "✛") }).addTo(carte);
      txtPl.textContent = "Ajustez le point si besoin, puis validez.";
      valPl.disabled = false;
    } else {
      placement.marqueur.setLatLng(e.latlng);
    }
  });
  function annulerPlacement() {
    if (!placement) return;
    var mode = placement.mode;
    if (placement.marqueur) carte.removeLayer(placement.marqueur);
    placement = null;
    barrePl.hidden = true;
    if (mode === "deplacer" || vueCourante) ficheEl.hidden = false;
  }
  valPl.addEventListener("click", function () {
    if (!placement || !placement.marqueur) return;
    var ll = placement.marqueur.getLatLng();
    var mode = placement.mode;
    carte.removeLayer(placement.marqueur);
    placement = null;
    barrePl.hidden = true;
    if (mode === "deplacer") {
      var latEl = ficheContenu.querySelector('[name="c-lat"]');
      var lngEl = ficheContenu.querySelector('[name="c-lng"]');
      if (latEl) latEl.value = ll.lat.toFixed(5);
      if (lngEl) lngEl.value = ll.lng.toFixed(5);
      ficheEl.hidden = false;
      villeDepuis(ll, function (ville) {
        var vi = ficheContenu.querySelector('[name="c-ville"]');

  annPl.addEventListener("click", annulerPlacement);

  ficheContenu.addEventListener("click", function (ev) {
    var b;

      naviguer({ type: "machine", nom: b.dataset.mach });
      return;
    }
    if ((b = ev.target.closest(".aill")) || (b = ev.target.closest(".gc-nom")) || (b = ev.target.closest(".mach-res"))) {
      naviguer({ type: "centre", id: b.dataset.id });
      return;
    }
    if (ev.target.closest("#gc-nouveau")) { demarrerNouveau(); return; }
    if (ev.target.closest(".mach-va-creer")) { ouvrirCreationMachine(); return; }
    if (ev.target.closest("#gcm-retour-edition")) { reprendreEdition(); return; }
    if ((b = ev.target.closest(".gcm-pli"))) {
      var idPli = b.dataset.id;
      if (catsRepliees[idPli]) delete catsRepliees[idPli];
      else catsRepliees[idPli] = true;
      sauverReplis();
      rafraichirVueMachines();
      return;
    }
    if ((b = ev.target.closest(".gcm-cat-del"))) {
      var idCat = b.dataset.id, cat = null;
      CATS.forEach(function (x) { if (x.id === idCat) cat = x; });
      if (!cat) return;
      var contenu = enfantsCat(idCat).length + machinesDeCat(idCat).length;
      if (!confirm("Supprimer la catégorie « " + cat.nom + " » ?" + (contenu ? "\nSon contenu (" + contenu + ") remontera d'un niveau." : ""))) return;
      var parentCat = cat.parent || null;
      CATS.forEach(function (x) { if ((x.parent || null) === idCat) x.parent = parentCat; });
      MACHINES.forEach(function (m) { if ((m.cat || null) === idCat) m.cat = parentCat; });
      for (var iC = CATS.length - 1; iC >= 0; iC--) if (CATS[iC].id === idCat) CATS.splice(iC, 1);
      delete catsRepliees[idCat];
      sauverReplis();
      sauverMachines();
      remplirSelectMachines();
      rafraichirVueMachines();
      return;
    }
    if ((b = ev.target.closest(".gcm-mach-del"))) {

      var fiches = CENTRES.filter(function (x) {
        var i = INFOS[x.id];
        return i && Array.isArray(i.machinesListe) && i.machinesListe.indexOf(nomDel) !== -1;
      });
      if (!confirm("Supprimer la machine « " + nomDel + " » de la liste ?" + (fiches.length ? "\nElle sera aussi retirée de " + fiches.length + " fiche" + (fiches.length > 1 ? "s" : "") + " de centre." : ""))) return;
      for (var iM = MACHINES.length - 1; iM >= 0; iM--) if (MACHINES[iM].nom === nomDel) MACHINES.splice(iM, 1);
      fiches.forEach(function (x) {
        INFOS[x.id].machinesListe = INFOS[x.id].machinesListe.filter(function (n) { return n !== nomDel; });
        sauverCentre(x);
      });
      var iF = state.machs.indexOf(nomDel);
      if (iF !== -1) { state.machs.splice(iF, 1); majFiltChips(); }
      if (editionEnAttente && Array.isArray(editionEnAttente.brouillon.infos.machinesListe)) {
        editionEnAttente.brouillon.infos.machinesListe = editionEnAttente.brouillon.infos.machinesListe.filter(function (n) { return n !== nomDel; });
      }

      remplirSelectMachines();
      rafraichirVueMachines();

    }
    if (ev.target.closest("#gcm-cat")) {

      if (nomCat) {

    if ((b = ev.target.closest(".gcm-souscat"))) {

      if (nomSous) {

        remplirSelectMachines();
        rafraichirVueMachines();
      }

    }
    if ((b = ev.target.closest(".gcm-machplus"))) {
      var nomMach = (prompt("Nom de la nouvelle machine :") || "").trim();
      if (nomMach) {
        var dejaLa = MACHINES.some(function (m) { return m.nom.toLowerCase() === nomMach.toLowerCase(); });
        if (dejaLa) { alert("Cette machine existe déjà dans la liste."); return; }
        MACHINES.push({ nom: nomMach, alias: [nomMach], cat: b.dataset.cat || null });
        sauverMachines();
        remplirSelectMachines();
        if (editionEnAttente) {
          var lst = editionEnAttente.brouillon.infos.machinesListe;
          if (!Array.isArray(lst)) lst = editionEnAttente.brouillon.infos.machinesListe = [];
          if (lst.indexOf(nomMach) === -1) lst.push(nomMach);

    }
    if (ev.target.closest(".btn-pos")) { demarrerDeplacement(); return; }
    if ((b = ev.target.closest(".th-up"))) { deplacer(b.closest(".th-bloc"), -1); return; }
    if ((b = ev.target.closest(".th-down"))) { deplacer(b.closest(".th-bloc"), 1); return; }
    if ((b = ev.target.closest(".th-del"))) {
      var blocSup = b.closest(".th-bloc");
      var std = blocSup.dataset.perso !== "1";
      var aDesCases = !!blocSup.querySelector(".ssec-item");
      var msg = std
        ? "Retirer ce bloc de la fiche ? Ses informations restent enregistrées et il pourra être rétabli via « Rétablir » plus bas."
        : "Supprimer ce bloc et ses cases ?";
      if ((!std && !aDesCases) || confirm(msg)) { blocSup.remove(); majRetablir(); }
      return;
    }
    if ((b = ev.target.closest(".th-re"))) {
      var cleRe = b.dataset.cle;
      document.getElementById("themes-edit").insertAdjacentHTML("beforeend",
        blocThemeHtml(ficheCentre || {}, infosDe(ficheCentre || {}), { cle: cleRe, titre: titreStandard(cleRe), masque: false }));
      majRetablir();
      return;
    }
    if ((b = ev.target.closest(".btn-fmt"))) {
      var itF = b.closest(".ssec-item");
      var ta = itF.querySelector(".ssec-texte");
      if (!ta) return;
      var mq = b.dataset.fmt, n = mq.length;
      var d = ta.selectionStart, f = ta.selectionEnd, val = ta.value;
      var sel = val.slice(d, f);
      if (sel.length >= 2 * n && sel.slice(0, n) === mq && sel.slice(-n) === mq) {
        // déjà mis en forme : on retire les marqueurs
        var nu = sel.slice(n, sel.length - n);
        ta.value = val.slice(0, d) + nu + val.slice(f);
        ta.focus();
        ta.setSelectionRange(d, d + nu.length);
        return;
      }
      if (val.slice(d - n, d) === mq && val.slice(f, f + n) === mq) {
        ta.value = val.slice(0, d - n) + sel + val.slice(f + n);
        ta.focus();
        ta.setSelectionRange(d - n, d - n + sel.length);
        return;
      }
      ta.value = val.slice(0, d) + mq + sel + mq + val.slice(f);
      ta.focus();
      ta.setSelectionRange(d + n, d + n + sel.length);
      return;
    }
    if ((b = ev.target.closest(".btn-just"))) {
      var itJ = b.closest(".ssec-item");
      if (itJ.dataset.just === "1") { delete itJ.dataset.just; b.classList.remove("actif"); }

    }
    if ((b = ev.target.closest(".ssec-pos"))) {
      var item = b.closest(".ssec-item");

      return;
    }
    if ((b = ev.target.closest(".ssec-up"))) { deplacer(b.closest(".ssec-item"), -1); return; }
    if ((b = ev.target.closest(".ssec-down"))) { deplacer(b.closest(".ssec-item"), 1); return; }
    if ((b = ev.target.closest(".ssec-del"))) { b.closest(".ssec-item").remove(); return; }
    if ((b = ev.target.closest(".ssec-add"))) {
      b.closest(".th-bloc").querySelector(".ssecs").insertAdjacentHTML("beforeend", ssecItem({ titre: "", texte: "", pos: b.dataset.pos === "haut" ? "haut" : "gauche" }));
      return;
    }
    if (ev.target.closest("#th-add")) {
      document.getElementById("themes-edit").insertAdjacentHTML("beforeend",
        blocThemeHtml(ficheCentre || {}, {}, { cle: "nouveau-bloc-" + Date.now(), titre: "" }));
      return;
    }
    if ((b = ev.target.closest(".mchip-del"))) {
      var blocC = b.closest(".th-bloc");
      b.closest(".mchip").remove();
      majMachSel(blocC);
      return;
    }
    if (ev.target.closest(".btn-modif") && ficheCentre) { ouvrirEdition(ficheCentre, false); return; }
    if (ev.target.closest(".btn-ann")) {
      if (vueCourante) afficherVue(vueCourante);
      else fermerFiche();
      return;
    }
    if (ev.target.closest(".btn-val") && ficheCentre) {
      var lu = lireForm(ficheCentre);
      var c = ficheCentre;
      if (c.id === null) {
        var ids = CENTRES.map(function (x) { return x.id; });
        var id = slugId(lu.data.ville || lu.data.nom, ids);
        c = { id: id };
        CENTRES.push(c);
      }
      appliquerData(c, lu.data);
      INFOS[c.id] = lu.infos;
      sauverCentre(c);
      vueCourante = { type: "centre", id: c.id };
      histo = [];
      render();
      afficherVue(vueCourante);
    }
  });
  ficheContenu.addEventListener("change", function (ev) {
    var sel = ev.target.closest(".mach-sel");
    if (sel && sel.value) {
      ajouterChip(sel.closest(".th-bloc"), sel.value);
      return;
    }
    var dest = ev.target.closest(".gcm-dest");
    if (dest) {
      var cible = dest.value || null;
      if (dest.dataset.type === "mach") {
        for (var i = 0; i < MACHINES.length; i++) if (MACHINES[i].nom === dest.dataset.nom) MACHINES[i].cat = cible;
      } else {
        for (var j = 0; j < CATS.length; j++) if (CATS[j].id === dest.dataset.id) CATS[j].parent = cible;
      }
      sauverMachines();
      remplirSelectMachines();
      rafraichirVueMachines();
      return;
    }
    var ck = ev.target.closest(".gc-actif");
    if (ck) {
      var c = centreParId(ck.dataset.id);
      if (!c) return;
      c.actif = ck.checked;
      sauverCentre(c);
      render();
    }
  });
  ficheContenu.addEventListener("click", function (ev) {
    if (ev.target.closest("#exp-data")) telecharger("data.js", serialiserFichierData(CENTRES));
    else if (ev.target.closest("#exp-infos")) telecharger("infos.js", serialiserFichierInfos(MACHINES, CATS, INFOS, CENTRES.map(function (c) { return c.id; })));
  });

  function majMachSel(bloc) {
    var deja = [];
    bloc.querySelectorAll(".mach-liste .mchip").forEach(function (chip) { deja.push(chip.dataset.nom); });
    bloc.querySelector(".mach-sel").innerHTML = optionsMachSel(deja);
  }
  function ajouterChip(bloc, nom) {
    var deja = [];
    bloc.querySelectorAll(".mach-liste .mchip").forEach(function (chip) { deja.push(chip.dataset.nom); });
    if (deja.indexOf(nom) === -1) bloc.querySelector(".mach-liste").insertAdjacentHTML("beforeend", mchipHtml(nom));
    majMachSel(bloc);
  }
  function deplacer(el, sens) {
    if (sens < 0 && el.previousElementSibling) el.parentNode.insertBefore(el, el.previousElementSibling);
    else if (sens > 0 && el.nextElementSibling) el.parentNode.insertBefore(el.nextElementSibling, el);
  }

  function telecharger(nomFichier, contenu) {
    var blob = new Blob([contenu], { type: "text/javascript;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = nomFichier;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
  }

  // ——— Filtre machines (ET logique) ———
  var selMach = document.getElementById("sel-mach");
  var filtChips = document.getElementById("filt-chips");
  function remplirSelectMachines() {
    selMach.innerHTML = '<option value="">Filtrer par machine…</option>' + optionsMachinesArbre(state.machs);
  }
  function majFiltChips() {
    filtChips.innerHTML = state.machs.map(function (nom) {
      return '<span class="mchip" data-nom="' + esc(nom) + '">' + esc(nom) + '<button type="button" class="filt-del" title="Retirer ce filtre">&times;</button></span>';
    }).join("");
  }
  function basculerFiltreMachine(nom) {
    var i = state.machs.indexOf(nom);
    if (i === -1) state.machs.push(nom);
    else state.machs.splice(i, 1);
    remplirSelectMachines();
    majFiltChips();
    render();
  }
  selMach.addEventListener("change", function () {
    if (!selMach.value) return;
    basculerFiltreMachine(selMach.value);
    selMach.value = "";
  });
  filtChips.addEventListener("click", function (ev) {
    var b = ev.target.closest(".filt-del");
    if (!b) return;
    basculerFiltreMachine(b.closest(".mchip").dataset.nom);
  });
  remplirSelectMachines();

  document.getElementById("btn-centres").addEventListener("click", function () {
    naviguer({ type: "gestion" }, ficheEl.hidden);
  });
  document.getElementById("btn-machines").addEventListener("click", function () {
    naviguer({ type: "gestion-machines" }, ficheEl.hidden);
  });

  var miniNom = document.getElementById("mini-nom");
  var miniBadge = document.getElementById("mini-badge");
  var miniBtn = document.getElementById("mini-btn");
  var totaux = { mq: 0, hex: 0, mqCls: "im" };

  function auxAntilles() { return carte.getCenter().lng < -30; }
  function majEncart() {
    var om = auxAntilles();
    miniNom.textContent = om ? "Hexagone" : "Martinique";
    miniBtn.setAttribute("aria-label", om ? "Revenir à l'Hexagone" : "Aller à la Martinique");
    var n = om ? totaux.hex : totaux.mq;
    miniBadge.textContent = n > 0 ? n + " pl." : "";
    miniCouche.clearLayers();
    var cMQ = centreParId("martinique-chu");
    if (!om && cMQ && totaux.mq > 0) {
      miniCouche.addLayer(L.marker([cMQ.lat, cMQ.lng], { icon: pastille(totaux.mqCls, totaux.mq), interactive: false }));
    }
    miniCarte.setView(om ? VUE_METRO.centre : VUE_MQ.centre, om ? 4 : 8, { animate: false });
  }
  miniBtn.addEventListener("click", function () {
    if (auxAntilles()) carte.setView(VUE_METRO.centre, VUE_METRO.zoom, { animate: false });
    else carte.setView(VUE_MQ.centre, VUE_MQ.zoom, { animate: false });
  });
  carte.on("moveend", majEncart);

  // ——— Panneau et encart repliables (préférence propre à chaque navigateur) ———
  var panneauEl = document.getElementById("panneau");
  var miniEl = document.getElementById("mini");
  var btnPanneauOuvrir = document.getElementById("panneau-ouvrir");
  var btnMiniOuvrir = document.getElementById("mini-ouvrir");
  var ui = (function () {
    try { return Object.assign({ panneau: true, mini: true }, JSON.parse(localStorage.getItem("eap-ui") || "{}")); }
    catch (e) { return { panneau: true, mini: true }; }
  })();
  function sauverUi() {
    try { localStorage.setItem("eap-ui", JSON.stringify(ui)); } catch (e) {}
  }
  function majUi() {
    panneauEl.hidden = !ui.panneau;
    btnPanneauOuvrir.hidden = ui.panneau;
    miniEl.hidden = !ui.mini;
    btnMiniOuvrir.hidden = ui.mini;
  }
  document.getElementById("panneau-fermer").addEventListener("click", function () { ui.panneau = false; sauverUi(); majUi(); });
  btnPanneauOuvrir.addEventListener("click", function () { ui.panneau = true; sauverUi(); majUi(); });
  document.getElementById("mini-fermer").addEventListener("click", function () { ui.mini = false; sauverUi(); majUi(); });
  btnMiniOuvrir.addEventListener("click", function () {
    ui.mini = true;
    sauverUi();
    majUi();
    miniCarte.invalidateSize();
    majEncart();
  });
  majUi();

  function render() {
    grappe.clearLayers();
    var mqTotal = 0, mqCls = "im";
    for (var i = 0; i < CENTRES.length; i++) {
      var c = CENTRES[i];
      if (!c.actif) continue;
      if (!passeFiltreMachines(c, state.machs)) continue;
      var total = totalDisplayed(c, state.sem, state.mod);
      if (total <= 0) continue;
      var cls = classify(c, state.sem, state.mod);
      var m = L.marker([c.lat, c.lng], { icon: pastille(cls, total), title: c.nom });
      m.on("click", (function (cc) { return function () { naviguer({ type: "centre", id: cc.id }, true); }; })(c));
      grappe.addLayer(m);
      if (c.id === "martinique-chu") { mqTotal = total; mqCls = cls; }
    }
    var s = computeStats(CENTRES, state.sem, state.mod, state.machs);
    totaux = { mq: mqTotal, hex: s.places - mqTotal, mqCls: mqCls };
    document.getElementById("stats").textContent = s.centres + " centres · " + s.places + " places (" + state.sem + ")";
    majEncart();
    if (!ficheEl.hidden && ficheMode !== "edition" && !editionEnAttente && vueCourante) afficherVue(vueCourante);
  }

  function brancher(idSeg, cle) {
    var seg = document.getElementById(idSeg);
    seg.addEventListener("click", function (ev) {
      var b = ev.target.closest("button");
      if (!b) return;
      var bs = seg.querySelectorAll("button");
      for (var i = 0; i < bs.length; i++) bs[i].classList.toggle("actif", bs[i] === b);
      state[cle] = b.dataset.val;
      render();
    });
  }
  brancher("seg-sem", "sem");
  brancher("seg-mod", "mod");

  render();
  chargerDepuisBase();
})();
</script>
</body>
</html>
